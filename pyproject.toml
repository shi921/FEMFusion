[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "femfusion"
version = "1.0.0"
description = "FEMFusion: CAD, FEM, and engineering proxy-text representation encoders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.2", "pandas>=2.0", "PyYAML>=6.0"]

[project.optional-dependencies]
# OCP is imported as OCP and typically installed via cadquery-ocp.
cad = ["torch-geometric>=2.5", "cadquery-ocp>=7.7"]
fem = []
text = ["transformers>=4.40", "sentencepiece>=0.1.99"]
all = ["torch-geometric>=2.5", "cadquery-ocp>=7.7", "transformers>=4.40", "sentencepiece>=0.1.99"]
download = ["huggingface-hub>=0.26"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
