# Native STEP / B-rep Face Graph single modality training. No dataset download.
data_dir: data/raw/agentfem
cache_dir: data/interim/cad
output_dir: outputs/cad/training
seed: 42
device: cpu
batch_size: 4
epochs: 100
patience: 20
learning_rate: 0.001
weight_decay: 0.0001
mask_ratio: 0.3
volume_weight: 0.1
model:
  hidden_dim: 128
  output_dim: 128
  layers: 3
  dropout: 0.1
